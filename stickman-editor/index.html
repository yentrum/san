<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Que Studio – Agent dựng video người que tự động</title>
<meta name="description" content="Nhập kịch bản, các trợ lý AI tự chia cảnh, dựng người que, thêm hiệu ứng, âm thanh, phụ đề và xuất video.">
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <a class="back" href="../" title="Về trang Sàn Yến Trùm">← Quay lại</a>
    <input id="title" class="title-in" value="Video người que" spellcheck="false" aria-label="Tên dự án">
    <span id="saved" class="muted">✓ Tự động lưu</span>
    <button class="ico" id="undo" title="Hoàn tác (Ctrl+Z)">↶</button>
    <button class="ico" id="redo" title="Làm lại (Ctrl+Y)">↷</button>
    <div class="spacer"></div>
    <div id="pill" class="pill"><span class="dots"><i></i><i></i><i></i><i></i><i></i></span><span id="pillText">Sẵn sàng — nhập kịch bản để bắt đầu</span></div>
    <button id="btnPack" class="ghost">▶ Gói đăng bài</button>
    <button id="btnExport" class="primary">Xuất video</button>
  </header>

  <main id="main">
    <aside id="left" class="panel">
      <nav class="tabs" id="leftTabs">
        <button data-tab="script" class="on">✎ Kịch bản</button>
        <button data-tab="scenes">▦ Cảnh</button>
        <button data-tab="audio">♪ Âm thanh</button>
        <button data-tab="look">✦ Giao diện</button>
      </nav>
      <div class="tabbody" id="leftBody"></div>
    </aside>

    <section id="center">
      <div id="stageBar">
        <select id="aspect" title="Khung hình"></select>
        <label class="chk"><input type="checkbox" id="qaMode"> Chế độ kiểm tra</label>
        <label class="chk"><input type="checkbox" id="subToggle" checked> Phụ đề</label>
        <div class="spacer"></div>
        <button class="ico" id="fsBtn" title="Toàn màn hình">⤢</button>
      </div>
      <div id="stageWrap"><div id="stage"><canvas id="cv"></canvas><div id="stageHint"></div></div></div>
      <div id="transport">
        <button class="ico" id="prevScene" title="Cảnh trước">⏮</button>
        <button class="play" id="playBtn" title="Phát / dừng (Space)">▶</button>
        <button class="ico" id="nextScene" title="Cảnh sau">⏭</button>
        <span id="timeLbl" class="mono">0:00.0 / 0:00.0</span>
        <div class="spacer"></div>
        <span class="muted small">Space: phát · ←/→: tua · S: cắt · Del: xoá</span>
      </div>
    </section>

    <aside id="right" class="panel">
      <nav class="tabs" id="rightTabs">
        <button data-tab="log" class="on">NHẬT KÝ ĐẠO DIỄN</button>
        <button data-tab="inspect">CHỈNH CẢNH</button>
      </nav>
      <div class="tabbody" id="rightBody"></div>
    </aside>
  </main>

  <section id="timeline">
    <div id="tlTools"></div>
    <div id="tlBody">
      <div id="tlLabels"></div>
      <div id="tlScroll"><div id="tlInner"></div></div>
    </div>
  </section>
</div>

<div id="modal" class="modal" hidden><div class="card" id="modalCard"></div></div>
<div id="toast"></div>

<script src="js/core.js"></script>
<script src="js/figure.js"></script>
<script src="js/props.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/agents.js"></script>
<script src="js/samples.js"></script>
<script src="js/app.js"></script>
</body>
</html>
